{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Atelier do Gandalf</title>
    <link rel="stylesheet" href="{% static 'css/estilo.css' %}">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <h1>Entrar</h1>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn-acao">Entrar</button>
            </form>
            <p><a href="/">Voltar ao catálogo</a></p>
        </div>
    </div>
</body>
</html>
